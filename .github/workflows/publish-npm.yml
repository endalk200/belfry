name: Stage npm Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check npm release status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_stage: ${{ steps.release.outputs.should_stage }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Check package version
        id: release
        run: |
          version="$(node -p 'require("./apps/cli/package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if npm view "@belfry/cli@${version}" version >/dev/null 2>&1; then
            echo "Version ${version} already exists on npm; skipping staging."
            echo "should_stage=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version ${version} is not on npm; staging is required."
          echo "should_stage=true" >> "$GITHUB_OUTPUT"

  stage:
    name: Stage @belfry/cli
    needs: preflight
    if: needs.preflight.outputs.should_stage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
      version: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Set up npm
        run: npm install -g npm@11.15.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit release dependencies
        run: bun run release:audit

      - name: Check formatting
        run: bun run format:check

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify npm package
        run: bun run release:verify

      - name: Smoke test packed npm package
        run: bun run release:smoke

      - name: Stage package on npm
        id: stage
        working-directory: apps/cli
        env:
          PKG_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if npm view "@belfry/cli@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PKG_VERSION} already exists on npm; skipping staging."
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm stage publish --access public --tag latest --provenance
          echo "staged=true" >> "$GITHUB_OUTPUT"

  github-release:
    name: Draft GitHub Release
    needs: stage
    if: needs.stage.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          tag="belfry-cli-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping tag push."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

          cat > release-notes.md <<EOF
          @belfry/cli ${VERSION}

          The npm package has been staged and is pending npm-side maintainer approval with 2FA.
          Publish this GitHub Release only after approving the staged package in npm.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Belfry CLI v${VERSION}" --notes-file release-notes.md
          else
            gh release create "$tag" --draft --title "Belfry CLI v${VERSION}" --notes-file release-notes.md
          fi
